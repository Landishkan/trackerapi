services:

  postgres:
    image: postgres:16-alpine
    container_name: tasktracker-postgres

    environment:
      # Название базы данных, которую создаст PostgreSQL
      POSTGRES_DB: tasktracker

      # Пользователь и пароль для локальной разработки
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      # Пробрасываем порт PostgreSQL на локальную машину
      - "5432:5432"

    volumes:
      # Сохраняем данные БД, чтобы они не пропадали после перезапуска контейнера
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # Проверка, что PostgreSQL готов принимать соединения
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasktracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: